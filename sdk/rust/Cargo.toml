[package]
name = "openaevc-sdk"
description = "OpenAEVC Rust SDK: one client API over the embedded runtime and the openaevcd daemon."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
openaevc-protocol.workspace = true
openaevc-canonical.workspace = true
openaevc-crypto.workspace = true
openaevc-core.workspace = true
openaevc-authority.workspace = true
openaevc-runtime.workspace = true
openaevc-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
openaevc-core.workspace = true
openaevc-testkit.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
