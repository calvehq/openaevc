[package]
name = "openaevc-sdk"
description = "OpenAEVC Rust SDK: one client API over the embedded runtime and the openaevcd daemon."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openaevc = { workspace = true, features = ["transport"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }

[dev-dependencies]
openaevc-testkit.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
