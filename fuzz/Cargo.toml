# cargo-fuzz targets (nightly). Run: cargo +nightly fuzz run <target> -- -max_total_time=60
[package]
name = "openaevc-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
openaevc-protocol = { path = "../crates/openaevc-protocol" }
openaevc-canonical = { path = "../crates/openaevc-canonical" }
openaevc-core = { path = "../crates/openaevc-core" }
openaevc-policy = { path = "../crates/openaevc-policy" }
openaevc-extension-contract = { path = "../crates/openaevc-extension-contract" }
serde_json = "1"

[[bin]]
name = "canonical_decode"
path = "fuzz_targets/canonical_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_envelopes"
path = "fuzz_targets/protocol_envelopes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "object_from_bytes"
path = "fuzz_targets/object_from_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_documents"
path = "fuzz_targets/policy_documents.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extension_frames"
path = "fuzz_targets/extension_frames.rs"
test = false
doc = false
bench = false
