[package]
name = "openaevc-conformance-cli"
description = "Runs the OpenAEVC conformance suite against a runtime, a daemon or an extension."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "openaevc-conformance"
path = "src/main.rs"
doc = false

[lints]
workspace = true

[dependencies]
openaevc-conformance.workspace = true
openaevc = { workspace = true, features = ["transport"] }
serde_json.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
