[package]
name = "openaevc-inspect"
description = "Narrow OpenAEVC protocol inspection tool (decode, canonicalize, digest, verify)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
openaevc-protocol.workspace = true
openaevc-canonical.workspace = true
openaevc-crypto.workspace = true
openaevc-core.workspace = true
openaevc-store.workspace = true
openaevc-transport.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio = { version = "1", features = ["rt", "net", "time"] }

[dev-dependencies]
tempfile.workspace = true
openaevc-testkit.workspace = true
openaevc-transport.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
