[package]
name = "openaevc-conformance"
description = "OpenAEVC conformance suite: executable protocol law with CORE, AUTHORITY, RUNTIME, EXTENSION_HOST and FULL profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openaevc = { workspace = true, features = ["transport"] }
openaevc-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

[dev-dependencies]
openaevc-testkit.workspace = true
axum.workspace = true
