[package]
name = "openaevc-testkit"
description = "Deterministic clocks, IDs, clients, providers and fixtures for OpenAEVC tests. Never a production dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
openaevc = { workspace = true, features = ["runtime"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# The runtime and transport integration tests live here: they need this crate, and keeping
# them out of `openaevc` keeps every local package out of the published crate's manifest.
[dev-dependencies]
openaevc = { workspace = true, features = ["full", "fault-injection"] }
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
