[workspace]
resolver = "2"
members = [
    "crates/openaevc-protocol",
    "crates/openaevc-canonical",
    "crates/openaevc-crypto",
    "crates/openaevc-core",
    "crates/openaevc-authority",
    "crates/openaevc-policy",
    "crates/openaevc-extension-contract",
    "crates/openaevc-execution",
    "crates/openaevc-verification",
    "crates/openaevc-composition",
    "crates/openaevc-store",
    "crates/openaevc-runtime",
    "crates/openaevc-transport",
    "crates/openaevc-sdk",
    "crates/openaevc-testkit",
    "bins/openaevcd",
    "bins/openaevc-inspect",
    "examples",
    "extensions/reference-null",
    "extensions/reference-kv",
    "extensions/conformance-fixtures",
    "tooling/generate-schemas",
    "tooling/fixture-builder",
    "tooling/generate-sdks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/Shiva936/OpenAEVC"
authors = ["OpenAEVC contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# ProtocolError is structured protocol data (spec/errors.md); boxing it everywhere buys nothing.
result_large_err = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
openaevc-protocol = { path = "crates/openaevc-protocol", version = "0.1.0" }
openaevc-canonical = { path = "crates/openaevc-canonical", version = "0.1.0" }
openaevc-crypto = { path = "crates/openaevc-crypto", version = "0.1.0" }
openaevc-core = { path = "crates/openaevc-core", version = "0.1.0" }
openaevc-authority = { path = "crates/openaevc-authority", version = "0.1.0" }
openaevc-store = { path = "crates/openaevc-store", version = "0.1.0" }
openaevc-policy = { path = "crates/openaevc-policy", version = "0.1.0" }
openaevc-extension-contract = { path = "crates/openaevc-extension-contract", version = "0.1.0" }
openaevc-execution = { path = "crates/openaevc-execution", version = "0.1.0" }
openaevc-verification = { path = "crates/openaevc-verification", version = "0.1.0" }
openaevc-composition = { path = "crates/openaevc-composition", version = "0.1.0" }
openaevc-runtime = { path = "crates/openaevc-runtime", version = "0.1.0" }
openaevc-transport = { path = "crates/openaevc-transport", version = "0.1.0" }
openaevc-sdk = { path = "crates/openaevc-sdk", version = "0.1.0" }
openaevc-testkit = { path = "crates/openaevc-testkit" }
proptest = "1"
schemars = "1"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"

# Hashing and signatures dominate test time in unoptimized builds (extensions hash their own
# executables on every handshake).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.curve25519-dalek]
opt-level = 3
