name: release
# Builds, verifies, signs and packages a release, then publishes `openaevc` to crates.io, npm and PyPI.
# Publication runs only for a `v*` tag and only after the signed artifacts are assembled.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # A release is cut only from a commit already on master (which passed ci.yml).
      - name: Release commit is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - run: rustup show
      # Scenario J drives the daemon from every SDK.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Generated files and requirement coverage
        run: |
          cargo run -q --locked -p generate-schemas -- --check
          cargo run -q --locked -p generate-sdks -- --check
          cargo run -q --locked -p fixture-builder -- --check
          python3 tooling/release-check/check.py --markers
          python3 tooling/release-check/coverage.py
      - run: cargo test --workspace --all-features --locked
      - run: cargo publish -p openaevc --locked --dry-run
      # Scenario K: the release daemon from a clean data root passes FULL conformance remotely,
      # including real restart recovery; the reports are release evidence.
      - run: cargo test --release --locked -p openaevcd --test scenario_k -- --nocapture
        env:
          OPENAEVC_CONFORMANCE_REPORT_DIR: conformance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-conformance
          path: conformance/*
      - name: SDK suites
        run: |
          (cd sdk/typescript && npm ci && npm run typecheck && npm test)
          (cd sdk/python && python -m unittest discover -s tests -p 'test_*.py')
          (cd sdk/go && go vet ./... && go test ./...)

  binaries:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo build --release --locked -p openaevcd -p openaevc-conformance-cli -p openaevc-inspect
        env:
          SOURCE_DATE_EPOCH: "0"
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      - name: Package
        shell: bash
        run: |
          exe=""; [ "${{ runner.os }}" = "Windows" ] && exe=".exe"
          mkdir dist
          for b in openaevcd openaevc-conformance openaevc-inspect; do
            cp "target/release/$b$exe" "dist/$b-${{ matrix.target }}$exe"
          done
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  # Third-party SBOM tooling runs without an OIDC token; only the signing job can mint one.
  sbom:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: openaevc.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: openaevc.spdx.json

  assemble:
    needs: [binaries, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Source, schemas and fixtures
        run: |
          git archive --format=tar.gz --prefix=openaevc/ -o dist/openaevc-src.tar.gz HEAD
          tar czf dist/openaevc-schemas.tar.gz schemas
          tar czf dist/openaevc-conformance-fixtures.tar.gz fixtures
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Keyless signatures
        working-directory: dist
        run: |
          for f in *; do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/*

  publish:
    needs: [verify, assemble]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # Every publish step skips a version its registry already has, so a failed publish is
      # retried with "Re-run failed jobs".
      # `openaevc` is the only crate published to crates.io; every other package is publish = false.
      - name: Publish openaevc to crates.io
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="openaevc") | .version')
          if curl -sf -A "openaevc-release (github.com/calvehq/openaevc)" "https://crates.io/api/v1/crates/openaevc/$v" >/dev/null; then
            echo "openaevc $v already on crates.io; skipping"
          else
            cargo publish -p openaevc --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # npm trusted publishing (OIDC, provenance included): no token secret. Needs npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Publish @openaevc/sdk to npm
        working-directory: sdk/typescript
        run: |
          npm install -g npm@^11.5.1
          npm ci && npm run build
          pkg="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "$pkg" version >/dev/null 2>&1; then
            echo "$pkg already on npm; skipping"
          else
            npm publish --provenance --access public
          fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - working-directory: sdk/python
        run: python -m pip install build twine && python -m build && twine check dist/*
      # PyPI trusted publishing (OIDC): no token secret.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          skip-existing: true
