name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo doc --workspace --no-deps --locked
