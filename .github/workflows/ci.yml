name: ci
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show            # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # `openaevc` alone (no other member's features unify in): the library under every
      # feature set, then its own tests, then the minimal default build.
      - name: Feature matrix
        run: |
          for f in "" store fault-injection runtime transport full; do
            cargo clippy -p openaevc --no-default-features --features "$f" --lib --locked -- -D warnings
            cargo clippy -p openaevc --no-default-features --features "$f" --all-targets --locked -- -D warnings
          done
          cargo build -p openaevc --locked
      - run: python3 -m unittest discover -s tooling/release-check -p 'test_*.py'
      - run: python3 tooling/release-check/check.py --markers
      - name: Requirement coverage
        run: python3 tooling/release-check/coverage.py
      - name: Generated files are up to date
        run: |
          cargo run -q --locked -p generate-schemas -- --check
          cargo run -q --locked -p generate-sdks -- --check
          cargo run -q --locked -p fixture-builder -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      # Scenario J drives the daemon from every SDK.
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: cargo build --workspace --locked
      # Includes the conformance suite: the reference runtime must pass FULL in-process.
      - run: cargo test --workspace --locked
      - run: cargo test -p openaevc --all-features --locked

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: TypeScript
        working-directory: sdk/typescript
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Python
        working-directory: sdk/python
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Go
        working-directory: sdk/go
        run: go vet ./... && go test ./...

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --workspace --locked
